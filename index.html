<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw Board</title>
  <link rel="icon" href="data:,">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' ws: https://accounts.google.com/gsi/ https://www.googleapis.com">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa; font: 13px system-ui, sans-serif; }
    #board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    #toolbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center;
      padding: 6px; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px #0002; user-select: none; }
    #toolbar button { width: 34px; height: 34px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 17px;
      display: grid; place-items: center; }
    #toolbar button:hover { background: #f0f0f0; }
    #toolbar button.on { background: #e5ebff; }
    #toolbar button .dot { border-radius: 50%; }
    #toolbar input[type=color] { width: 30px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
    #toolbar input[type=range] { width: 80px; }
    .sep { width: 1px; align-self: stretch; background: #ddd; margin: 0 4px; }
    #hint { position: fixed; left: 10px; bottom: 8px; color: #888; pointer-events: none; }
    #status { position: fixed; right: 10px; bottom: 8px; color: #c33; pointer-events: none; }
    [hidden] { display: none !important; }
    #drive:not(.on) svg { filter: grayscale(1); opacity: .55; } /* colour = connected */
    #drive-dlg { border: 0; border-radius: 10px; box-shadow: 0 4px 24px #0003; padding: 14px; min-width: 320px; font: inherit; }
    #drive-files { list-style: none; margin: 10px 0; padding: 0; max-height: 50vh; overflow: auto; }
    #drive-files button { width: 100%; display: flex; justify-content: space-between; gap: 16px; border: 0; background: none;
      padding: 6px 8px; border-radius: 6px; cursor: pointer; font: inherit; text-align: left; }
    #drive-files button:hover { background: #f0f0f0; }
    #drive-files small { color: #888; }
    .dlg-row { display: flex; gap: 6px; justify-content: flex-end; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <div id="toolbar">
    <button data-tool="select" title="Select (V)">⬚</button>
    <button data-tool="pen" title="Pen (P)">✎</button>
    <button data-tool="eraser" title="Eraser (E) — or drag with right mouse button">⌫</button>
    <span class="sep"></span>
    <span id="presets" style="display:flex;gap:2px"></span>
    <input id="color" type="color" title="Pen color">
    <input id="width" type="range" min="1" max="40" title="Pen thickness">
    <span class="sep"></span>
    <button id="open" title="Open file (Ctrl+O)">📂</button>
    <button id="save" title="Save to file (Ctrl+S) · Shift+click / Ctrl+Shift+S: Save as">💾</button>
    <button id="drive" title="Connect Google Drive" hidden><svg viewBox="0 0 87.3 78" width="20" height="18" aria-hidden="true">
      <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
      <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5z" fill="#00ac47"/>
      <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
      <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
      <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
      <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
    </svg></button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  </div>
  <div id="hint">Shift+draw: snap to grid · Right-drag: erase · Wheel: zoom · Middle / Space-drag / Shift+wheel: pan · Ctrl+C / Ctrl+V: copy / paste at cursor · Del: delete</div>
  <div id="status"></div>
  <dialog id="drive-dlg">
    <b>Google Drive · draw_board_files</b>
    <ul id="drive-files"></ul>
    <form method="dialog" class="dlg-row">
      <button type="button" id="drive-save">Save board as…</button>
      <button type="button" id="drive-off">Disconnect</button>
      <button>Close</button>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
